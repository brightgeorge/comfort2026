<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trading Account</title>

  <style>
    body {
      font-family: "Times New Roman", serif;
      margin: 20px;
    }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      text-decoration: underline;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #000;
      padding: 10px;
    }

    th {
      background: #eee;
      text-align: center;
    }

    td {
      vertical-align: top;
    }

    .amount {
      text-align: right;
      width: 25%;
    }

    .label {
      width: 25%;
    }

    .total {
      font-weight: bold;
      background: #f5f5f5;
    }

    .center {
      text-align: center;
    }
  </style>
</head>

<body>

<div class="title">TRADING ACCOUNT</div>

<table>

  <!-- HEADER -->
  <tr>
    <th>DEBIT SIDE</th>
    <th>AMOUNT (₹)</th>
    <th>CREDIT SIDE</th>
    <th>AMOUNT (₹)</th>
  </tr>

  <!-- ROW 1 (MAIN SUMMARY ONLY) -->
  <tr>
    <td class="label">
      Opening Stock<br>
      Purchases<br>
      Wages<br>
      Freight Inwards<br>
      Other Expenses
    </td>

    <td class="amount">
      {{ debit_total }}
    </td>

    <td class="label">
      Sales<br>
      Closing Stock<br>
      Other Income
    </td>

    <td class="amount">
      {{ credit_total }}
    </td>
  </tr>

  <!-- ROW 2 (TOTAL ROW ONLY) -->
  <tr class="total">
    <td>Total</td>
    <td class="amount">{{ debit_total }}</td>

    <td>Total</td>
    <td class="amount">{{ credit_total }}</td>
  </tr>

</table>

</body>
</html>
